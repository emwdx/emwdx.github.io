<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown + LaTeX Editor</title>

<!--
  Markdown + KaTeX -> print-ready document.

  PDF export goes through the browser's own print engine (window.print, plus the
  @page rule below), NOT through html2canvas/html2pdf. That is deliberate: the
  PDF is produced by the same layout pass that drew the preview, so the two
  cannot disagree. Text stays selectable, KaTeX stays vector, and a 16-page
  handout is ~450 KB instead of ~7 MB of JPEG.

  The on-screen sheet (#sheet) is sized to the printable area (page width minus
  both margins), so lines wrap on screen exactly where they wrap on paper.

  In the print dialog choose "Save as PDF", and turn "Headers and footers" on if
  you want page numbers.
-->

<!-- Bootstrap 5 & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- KaTeX (Math Rendering) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- Marked.js (Markdown Parser) -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<!-- Raster image export only (PNG). PDF uses the browser's own print engine. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>

<!-- Page geometry: rewritten by JS so @page and the on-screen sheet always agree -->
<style id="pageRules">@page { size: letter portrait; margin: 0.75in; }</style>

<style>
  :root{
    --page-w: 8.5in;
    --page-h: 11in;
    --page-m: 0.75in;
    --base-size: 11pt;
    --body-font: Georgia, "Times New Roman", Times, serif;
    --head-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --text-align: left;
    --ui-bg: #eef0f3;
    --ink: #111;
  }
  html, body { height: 100%; }
  body { background: var(--ui-bg); }

  /* ---------- Editor shell ---------- */
  .app { height: 100%; display: flex; flex-direction: column; }
  .sticky-toolbar { background: #fff; border-bottom: 1px solid #dee2e6; }
  .btn-icon { display: inline-flex; align-items: center; gap: .35rem; }
  #src {
    resize: none; outline: none; box-shadow: none; background: #fff; color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: .85rem; line-height: 1.5; tab-size: 2;
  }
  .preview-scroll { overflow: auto; background: #dfe3e8; }
  .zoom-box { margin: 1rem auto; }

  /* ---------- The paper ---------- */
  /* .paper is the full sheet (screen only). #sheet is the printable content area:
     its width equals page width minus both margins, so lines wrap on screen at
     exactly the same place they wrap in the PDF. */
  .paper {
    width: var(--page-w);
    min-height: var(--page-h);
    padding: var(--page-m);
    box-sizing: border-box;
    background: #fff;
    box-shadow: 0 .5rem 2rem rgba(0,0,0,.18);
    transform-origin: top left;
  }
  #sheet {
    width: 100%;
    color: var(--ink);
    font-family: var(--body-font);
    font-size: var(--base-size);
    line-height: 1.45;
  }

  /* Page-break guides (screen only) — period is the printable height */
  .paper.show-guides #sheet {
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--page-h) - 2 * var(--page-m) - 1px),
      rgba(220,53,69,.35) calc(var(--page-h) - 2 * var(--page-m) - 1px),
      rgba(220,53,69,.35) calc(var(--page-h) - 2 * var(--page-m)),
      transparent calc(var(--page-h) - 2 * var(--page-m))
    );
    background-size: 100% calc(var(--page-h) - 2 * var(--page-m));
    background-repeat: repeat-y;
  }

  /* ---------- Document typography ---------- */
  #sheet > *:first-child { margin-top: 0; }
  #sheet h1, #sheet h2, #sheet h3, #sheet h4, #sheet h5, #sheet h6 {
    font-family: var(--head-font); color: #000; font-weight: 700;
    margin: 1.1em 0 .45em; line-height: 1.25;
  }
  #sheet h1 { font-size: 1.55em; border-bottom: 2px solid #d9d9d9; padding-bottom: .3em; }
  #sheet h2 { font-size: 1.22em; border-bottom: 1px solid #e6e6e6; padding-bottom: .22em; }
  #sheet h3 { font-size: 1.06em; }
  #sheet h4, #sheet h5, #sheet h6 { font-size: 1em; }
  #sheet p { margin: 0 0 .7em; text-align: var(--text-align); }
  #sheet ul, #sheet ol { margin: 0 0 .7em; padding-left: 1.6em; }
  #sheet li { margin-bottom: .22em; }
  #sheet li > ul, #sheet li > ol { margin-top: .22em; margin-bottom: .22em; }
  #sheet hr { border: 0; border-top: 1px solid #c9c9c9; margin: 1.4em 0; }
  #sheet blockquote {
    border-left: 3px solid #d0d0d0; padding: .1em 0 .1em 1em; margin: 0 0 .8em;
    color: #444; font-style: italic;
  }
  #sheet a { color: #0a58ca; text-decoration: none; }
  #sheet strong { font-weight: 700; }

  #sheet code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: .88em; background: #f4f4f5; padding: .1em .3em; border-radius: 3px;
    color: #b02a37;
  }
  #sheet pre {
    background: #f7f7f8; border: 1px solid #e3e3e6; border-radius: 4px;
    padding: .7em .85em; margin: 0 0 .9em; overflow-x: auto;
    font-size: .82em; line-height: 1.35; white-space: pre;
  }
  #sheet pre code { background: none; padding: 0; color: #24292f; font-size: 1em; }

  #sheet table {
    width: 100%; border-collapse: collapse; margin: .9em 0;
    font-size: .95em; table-layout: auto;
  }
  #sheet th, #sheet td {
    border: 1px solid #bfbfbf; padding: .4em .55em; vertical-align: top;
    text-align: left; overflow-wrap: break-word;
  }
  #sheet th { background: #eceef0; font-weight: 700; font-family: var(--head-font); }
  #sheet tbody tr:nth-child(even) td { background: #f8f9fa; }

  #sheet img { max-width: 100%; height: auto; }

  /* Math */
  #sheet .katex { font-size: 1.05em; }
  #sheet .katex-display { margin: .8em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  #sheet .katex-error { color: #b02a37; background: #fdeaec; padding: 0 .15em; border-radius: 2px; }

  /* Manual page break: \newpage or \pagebreak on its own line */
  #sheet .page-break { break-before: page; page-break-before: always; height: 0; }
  .paper.show-guides #sheet .page-break {
    height: 0; border-top: 2px dashed #0d6efd; margin: 1em 0;
  }

  /* ---------- Print: this is the PDF ---------- */
  #printRoot { display: none; }

  @media print {
    html, body {
      background: #fff !important; margin: 0 !important; padding: 0 !important;
      height: auto !important; overflow: visible !important;
    }
    .app, .no-print { display: none !important; }
    #printRoot { display: block !important; }

    /* Shed all screen chrome — @page owns the paper size and margins now */
    #sheet {
      width: auto !important; max-width: none !important; min-height: 0 !important;
      margin: 0 !important; padding: 0 !important;
      background: none !important; background-image: none !important;
      box-shadow: none !important; overflow: visible !important;
      transform: none !important;
    }

    /* Keep backgrounds (table headers, zebra striping, code blocks) */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    /* Break control */
    #sheet h1, #sheet h2, #sheet h3, #sheet h4, #sheet h5, #sheet h6 {
      break-after: avoid; page-break-after: avoid;
      break-inside: avoid; page-break-inside: avoid;
    }
    #sheet p, #sheet li { orphans: 3; widows: 3; }
    #sheet thead { display: table-header-group; }
    #sheet tr, #sheet th, #sheet td { break-inside: avoid; page-break-inside: avoid; }
    #sheet pre, #sheet blockquote, #sheet figure, #sheet img,
    #sheet .katex-display { break-inside: avoid; page-break-inside: avoid; }
    /* overflow:auto clips in print — let wide content render in full */
    #sheet pre, #sheet .katex-display { overflow: visible !important; }
    #sheet hr { break-after: avoid; page-break-after: avoid; }
    #sheet .h1-new-page { break-before: page; page-break-before: always; }
    #sheet > .h1-new-page:first-child { break-before: auto; page-break-before: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Toolbar -->
  <div class="sticky-toolbar px-3 py-2">
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <span class="fs-6 fw-semibold me-1">MD + LaTeX Editor</span>
      <span id="status" class="badge text-bg-secondary">idle</span>

      <div class="vr mx-1"></div>

      <button id="pdfBtn" class="btn btn-sm btn-primary btn-icon">
        <i class="bi bi-filetype-pdf"></i><span>PDF</span>
      </button>
      <button id="pngBtn" class="btn btn-sm btn-outline-secondary btn-icon">
        <i class="bi bi-image"></i><span>PNG</span>
      </button>
      <button id="importBtn" class="btn btn-sm btn-outline-secondary btn-icon">
        <i class="bi bi-upload"></i><span>Open .md</span>
      </button>
      <button id="saveMdBtn" class="btn btn-sm btn-outline-secondary btn-icon">
        <i class="bi bi-download"></i><span>Save .md</span>
      </button>
      <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" class="d-none">

      <div class="vr mx-1"></div>

      <div class="input-group input-group-sm" style="width:auto">
        <label class="input-group-text" for="paper">Paper</label>
        <select id="paper" class="form-select">
          <option value="letter" selected>Letter</option>
          <option value="a4">A4</option>
          <option value="legal">Legal</option>
        </select>
      </div>
      <div class="input-group input-group-sm" style="width:auto">
        <label class="input-group-text" for="margin">Margin</label>
        <select id="margin" class="form-select">
          <option value="0.5in">0.5&quot;</option>
          <option value="0.75in" selected>0.75&quot;</option>
          <option value="1in">1&quot;</option>
        </select>
      </div>
      <div class="input-group input-group-sm" style="width:auto">
        <label class="input-group-text" for="fontSize">Size</label>
        <select id="fontSize" class="form-select">
          <option value="10pt">10 pt</option>
          <option value="11pt" selected>11 pt</option>
          <option value="12pt">12 pt</option>
        </select>
      </div>
      <div class="input-group input-group-sm" style="width:auto">
        <label class="input-group-text" for="fontFamily">Font</label>
        <select id="fontFamily" class="form-select">
          <option value="serif" selected>Serif</option>
          <option value="sans">Sans</option>
        </select>
      </div>
      <div class="input-group input-group-sm" style="width:auto">
        <label class="input-group-text" for="zoom">Zoom</label>
        <select id="zoom" class="form-select">
          <option value="fit" selected>Fit</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
        </select>
      </div>

      <div class="vr mx-1"></div>

      <div class="form-check form-check-inline form-switch m-0">
        <input class="form-check-input" type="checkbox" id="justifyChk">
        <label class="form-check-label small" for="justifyChk">Justify</label>
      </div>
      <div class="form-check form-check-inline form-switch m-0">
        <input class="form-check-input" type="checkbox" id="h1BreakChk">
        <label class="form-check-label small" for="h1BreakChk">H1 &rarr; new page</label>
      </div>
      <div class="form-check form-check-inline form-switch m-0">
        <input class="form-check-input" type="checkbox" id="guidesChk" checked>
        <label class="form-check-label small" for="guidesChk">Guides</label>
      </div>
    </div>
  </div>

  <!-- Main layout -->
  <div class="row g-0 flex-grow-1" style="min-height:0">
    <!-- Source -->
    <div class="col-12 col-lg-5 d-flex flex-column border-end" style="min-height:0">
      <div class="d-flex align-items-center justify-content-between px-3 py-1 bg-body-tertiary border-bottom">
        <span class="fw-semibold small">Markdown Source</span>
        <small class="text-secondary" id="docStats"></small>
      </div>
      <textarea id="src" class="form-control border-0 rounded-0 flex-grow-1 p-3" spellcheck="false"
        placeholder="# Title&#10;&#10;Inline math $ax^2+bx+c$ and display math:&#10;&#10;$$x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}$$&#10;&#10;\newpage starts a new page."></textarea>
    </div>

    <!-- Preview -->
    <div class="col-12 col-lg-7 d-flex flex-column" style="min-height:0">
      <div class="d-flex align-items-center justify-content-between px-3 py-1 bg-body-tertiary border-bottom">
        <span class="fw-semibold small">Print Preview <span class="text-secondary fw-normal">(what the PDF will look like)</span></span>
        <small class="text-secondary" id="pageInfo"></small>
      </div>
      <div class="preview-scroll flex-grow-1" id="previewScroll">
        <div class="zoom-box" id="zoomBox">
          <div class="paper show-guides" id="paperSheet">
            <div id="sheet"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Print target. #sheet is moved in here for printing so no scrolling/clipping
     ancestor can crop the document. -->
<div id="printRoot"></div>

<script>
(function () {
  'use strict';

  var PAPER = {
    letter: { w: 8.5,  h: 11,    css: 'letter' },
    a4:     { w: 8.27, h: 11.69, css: 'A4' },
    legal:  { w: 8.5,  h: 14,    css: 'legal' }
  };
  var FONTS = {
    serif: 'Georgia, "Times New Roman", Times, serif',
    sans:  '"Helvetica Neue", Helvetica, Arial, sans-serif'
  };
  var STORAGE_KEY = 'latex_renderer_src';
  var SETTINGS_KEY = 'latex_renderer_settings';

  var el = {};
  ['src','sheet','zoomBox','previewScroll','printRoot','status','pageInfo','docStats',
   'pageRules','fileInput'].forEach(function (id) { el[id] = document.getElementById(id); });
  el.paperSel   = document.getElementById('paper');
  el.marginSel  = document.getElementById('margin');
  el.sizeSel    = document.getElementById('fontSize');
  el.familySel  = document.getElementById('fontFamily');
  el.zoomSel    = document.getElementById('zoom');
  el.justify    = document.getElementById('justifyChk');
  el.h1Break    = document.getElementById('h1BreakChk');
  el.guides     = document.getElementById('guidesChk');
  el.paperEl    = document.getElementById('paperSheet');

  /* ------------------------------------------------------------------
     1. Markdown + math pipeline

     Order matters. Math is extracted before Markdown parsing so the
     parser cannot mangle it (\_, *, etc.), but code regions are found
     first so a `$` inside a code fence stays a literal dollar sign.
     Each math run is rendered to KaTeX HTML immediately, which is why
     the preview and the PDF are byte-identical DOM.
  ------------------------------------------------------------------ */

  // Fenced blocks and inline code spans. Everything matched here is
  // off-limits to the math scanner.
  var CODE_RE = /(?:^|\n)[ \t]*(`{3,}|~{3,})[^\n]*\n[\s\S]*?(?:\n[ \t]*\1[ \t]*(?=\n|$)|$)|`+[^`\n]*`+/g;

  var MATH_RE = new RegExp([
    '\\\\\\$',                              // \$  -> literal dollar
    '\\$\\$[\\s\\S]+?\\$\\$',               // $$ ... $$   display
    '\\\\\\[[\\s\\S]+?\\\\\\]',             // \[ ... \]   display
    '\\\\\\([\\s\\S]+?\\\\\\)',             // \( ... \)   inline
    '\\$(?![\\s$])(?:\\\\.|[^\\\\$\\n])*?\\$' // $ ... $     inline
  ].join('|'), 'g');

  var PLACEHOLDER = 'zzmathzz';   // markdown-inert: no punctuation, survives tables/headings

  var mathErrors = 0;

  function codeRegions(text) {
    var out = [], m;
    CODE_RE.lastIndex = 0;
    while ((m = CODE_RE.exec(text)) !== null) {
      out.push([m.index, m.index + m[0].length]);
      if (m[0].length === 0) CODE_RE.lastIndex++;
    }
    return out;
  }

  function inRegions(regions, start, end) {
    for (var i = 0; i < regions.length; i++) {
      if (start < regions[i][1] && end > regions[i][0]) return true;
    }
    return false;
  }

  // Authors escape pipes as \| so a Markdown table row does not split on them.
  // Inside an array/matrix column spec a pipe can only mean "column rule", and
  // \| is never valid there, so unescape it rather than showing a parse error.
  var COLSPEC_RE = /(\\begin\s*\{(?:array|tabular)\}\s*\{)([^{}]*)\}/g;
  function normalizeTex(tex) {
    return tex.replace(COLSPEC_RE, function (_, head, spec) {
      return head + spec.replace(/\\\|/g, '|') + '}';
    });
  }

  function renderMath(tex, display) {
    if (!window.katex) return '<code>' + escapeHtml(tex) + '</code>';
    tex = normalizeTex(tex);
    try {
      return window.katex.renderToString(tex, {
        displayMode: display,
        throwOnError: false,
        strict: false,
        output: 'htmlAndMathml',
        errorColor: '#b02a37'
      });
    } catch (e) {
      mathErrors++;
      return '<span class="katex-error" title="' + escapeHtml(String(e.message || e)) + '">' +
             escapeHtml(tex) + '</span>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function extractMath(text) {
    var regions = codeRegions(text);
    var parts = [], store = [], last = 0, m;
    MATH_RE.lastIndex = 0;
    while ((m = MATH_RE.exec(text)) !== null) {
      var raw = m[0], start = m.index, end = start + raw.length;
      if (inRegions(regions, start, end)) continue;

      var html, display = false;
      if (raw === '\\$') {
        html = '$';
      } else if (raw.slice(0, 2) === '$$') {
        display = true; html = renderMath(raw.slice(2, -2), true);
      } else if (raw.slice(0, 2) === '\\[') {
        display = true; html = renderMath(raw.slice(2, -2), true);
      } else if (raw.slice(0, 2) === '\\(') {
        html = renderMath(raw.slice(2, -2), false);
      } else {
        html = renderMath(raw.slice(1, -1), false);
      }

      var token = PLACEHOLDER + store.length + 'zz';
      store.push(html);
      parts.push(text.slice(last, start));
      // Display math gets blank lines around it so Marked makes it its own
      // block instead of burying a block-level .katex-display inside a <p>.
      parts.push(display ? '\n\n' + token + '\n\n' : token);
      last = end;
    }
    parts.push(text.slice(last));
    return { text: parts.join(''), store: store };
  }

  function applyPageBreaks(text) {
    var regions = codeRegions(text);
    var re = /(^|\n)[ \t]*\\(?:newpage|pagebreak)[ \t]*(?=\n|$)/g, m, parts = [], last = 0;
    while ((m = re.exec(text)) !== null) {
      if (inRegions(regions, m.index, m.index + m[0].length)) continue;
      parts.push(text.slice(last, m.index), m[1] + '\n<div class="page-break"></div>\n');
      last = m.index + m[0].length;
    }
    parts.push(text.slice(last));
    return parts.join('');
  }

  function render() {
    var text = el.src.value || '';
    mathErrors = 0;

    text = applyPageBreaks(text);
    var ex = extractMath(text);

    var html;
    try {
      html = window.marked.parse(ex.text, { gfm: true, breaks: false });
    } catch (e) {
      html = '<p class="katex-error">Markdown parse error: ' + escapeHtml(e.message) + '</p>';
    }

    // Restore with a replacer function: a plain string replacement would eat
    // `$$` and `$&` in the KaTeX HTML.
    html = html.replace(new RegExp(PLACEHOLDER + '(\\d+)zz', 'g'), function (_, i) {
      var v = ex.store[Number(i)];
      return v === undefined ? '' : v;
    });

    el.sheet.innerHTML = html;

    // Unwrap <p> wrappers whose only content is display math.
    Array.prototype.forEach.call(el.sheet.querySelectorAll('p'), function (p) {
      var kids = Array.prototype.filter.call(p.childNodes, function (n) {
        return !(n.nodeType === 3 && !n.textContent.trim());
      });
      if (kids.length === 1 && kids[0].nodeType === 1 &&
          kids[0].classList && kids[0].classList.contains('katex-display')) {
        p.parentNode.replaceChild(kids[0], p);
      }
    });

    mathErrors += el.sheet.querySelectorAll('.katex-error').length;
    applyH1Breaks();
    updateStatus();
    layout();
  }

  function applyH1Breaks() {
    var on = el.h1Break.checked;
    Array.prototype.forEach.call(el.sheet.querySelectorAll('h1'), function (h) {
      h.classList.toggle('h1-new-page', on);
    });
  }

  /* ------------------------------------------------------------------
     2. Geometry — one source of truth for @page and the on-screen sheet
  ------------------------------------------------------------------ */

  function applyGeometry() {
    var p = PAPER[el.paperSel.value] || PAPER.letter;
    var m = el.marginSel.value;
    var root = document.documentElement.style;

    root.setProperty('--page-w', p.w + 'in');
    root.setProperty('--page-h', p.h + 'in');
    root.setProperty('--page-m', m);
    root.setProperty('--base-size', el.sizeSel.value);
    root.setProperty('--body-font', FONTS[el.familySel.value] || FONTS.serif);
    root.setProperty('--head-font',
      el.familySel.value === 'sans' ? FONTS.sans : '"Helvetica Neue", Helvetica, Arial, sans-serif');
    root.setProperty('--text-align', el.justify.checked ? 'justify' : 'left');

    // @page cannot read custom properties, so the rule is rewritten here.
    el.pageRules.textContent = '@page { size: ' + p.css + ' portrait; margin: ' + m + '; }';

    el.paperEl.classList.toggle('show-guides', el.guides.checked);
    el.sheet.style.hyphens = el.justify.checked ? 'auto' : 'manual';
  }

  function layout() {
    var scale;
    var pw = el.paperEl.offsetWidth;
    if (!pw) return;
    if (el.zoomSel.value === 'fit') {
      var avail = el.previewScroll.clientWidth - 40;
      scale = Math.min(1, avail / pw);
    } else {
      scale = parseFloat(el.zoomSel.value);
    }
    if (!isFinite(scale) || scale <= 0) scale = 1;
    el.paperEl.style.transform = 'scale(' + scale + ')';
    el.zoomBox.style.width = (pw * scale) + 'px';
    el.zoomBox.style.height = (el.paperEl.offsetHeight * scale) + 'px';
    updatePageCount();
  }

  function updatePageCount() {
    // Printable height in px, measured from the live sheet rather than assumed.
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;height:calc(var(--page-h) - 2 * var(--page-m));';
    el.paperEl.appendChild(probe);
    var ph = probe.offsetHeight;
    el.paperEl.removeChild(probe);
    if (!ph) return;
    var pages = Math.max(1, Math.ceil(el.sheet.scrollHeight / ph));
    var breaks = el.sheet.querySelectorAll('.page-break, .h1-new-page').length;
    el.pageInfo.textContent = '~' + pages + ' page' + (pages === 1 ? '' : 's') +
      (breaks ? ' · ' + breaks + ' forced break' + (breaks === 1 ? '' : 's') : '');
  }

  function updateStatus() {
    var words = (el.src.value.match(/\S+/g) || []).length;
    el.docStats.textContent = words.toLocaleString() + ' words';
    if (mathErrors) {
      el.status.className = 'badge text-bg-danger';
      el.status.textContent = mathErrors + ' math error' + (mathErrors === 1 ? '' : 's');
      el.status.title = 'Invalid LaTeX is shown in red in the preview and will print that way.';
    } else {
      el.status.className = 'badge text-bg-success';
      el.status.textContent = 'ready';
      el.status.title = '';
    }
  }

  /* ------------------------------------------------------------------
     3. Export

     PDF goes through the browser's own print engine: the PDF is produced
     by the same layout pass that drew the preview, so it matches exactly,
     text stays selectable, and KaTeX output stays vector.
  ------------------------------------------------------------------ */

  function docTitle() {
    var h1 = el.sheet.querySelector('h1');
    var name = (h1 && h1.textContent.trim()) || 'document';
    return name.replace(/\s+/g, '_').replace(/[^A-Za-z0-9_\-]/g, '').substring(0, 60) || 'document';
  }

  var printHost = null;
  function toPrint() {
    if (printHost) return;
    printHost = el.sheet.parentNode;
    el.printRoot.appendChild(el.sheet);
  }
  function fromPrint() {
    if (!printHost) return;
    printHost.appendChild(el.sheet);
    printHost = null;
    layout();
  }
  window.addEventListener('beforeprint', toPrint);
  window.addEventListener('afterprint', fromPrint);

  document.getElementById('pdfBtn').addEventListener('click', function () {
    render();
    // document.title seeds the default filename in Chrome's "Save as PDF"
    var prev = document.title;
    document.title = docTitle();
    toPrint();
    window.print();
    // afterprint restores in Chrome; this is the belt-and-braces path.
    setTimeout(function () { fromPrint(); document.title = prev; }, 800);
  });

  document.getElementById('pngBtn').addEventListener('click', async function () {
    render();
    if (!window.html2canvas) { alert('html2canvas failed to load.'); return; }
    var guides = el.paperEl.classList.contains('show-guides');
    var tf = el.paperEl.style.transform;
    var align = document.documentElement.style.getPropertyValue('--text-align');
    el.paperEl.classList.remove('show-guides');
    el.paperEl.style.transform = 'none';   // html2canvas mis-handles scaled ancestors
    // html2canvas cannot reproduce justified text: it lays each word out at its
    // unjustified position, which runs words together. Rasterize left-aligned.
    if (el.justify.checked) {
      document.documentElement.style.setProperty('--text-align', 'left');
      el.status.className = 'badge text-bg-warning';
      el.status.textContent = 'PNG is left-aligned';
      el.status.title = 'The PNG rasterizer cannot justify text. Use PDF for justified output.';
    }
    try {
      var canvas = await window.html2canvas(el.paperEl, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        width: el.paperEl.offsetWidth, height: el.paperEl.offsetHeight,
        windowWidth: el.paperEl.offsetWidth, scrollX: 0, scrollY: -window.scrollY
      });
      var a = document.createElement('a');
      a.download = docTitle() + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    } finally {
      el.paperEl.style.transform = tf;
      document.documentElement.style.setProperty('--text-align', align);
      if (guides) el.paperEl.classList.add('show-guides');
    }
  });

  document.getElementById('importBtn').addEventListener('click', function () { el.fileInput.click(); });
  el.fileInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { setSource(String(r.result)); };
    r.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('saveMdBtn').addEventListener('click', function () {
    var blob = new Blob([el.src.value], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.download = docTitle() + '.md';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  // Drag a .md file anywhere onto the window
  ['dragover', 'drop'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      e.preventDefault();
      if (t === 'drop' && e.dataTransfer && e.dataTransfer.files[0]) {
        var r = new FileReader();
        r.onload = function () { setSource(String(r.result)); };
        r.readAsText(e.dataTransfer.files[0]);
      }
    });
  });

  function setSource(text) {
    el.src.value = text;
    try { localStorage.setItem(STORAGE_KEY, text); } catch (e) {}
    render();
  }

  /* ------------------------------------------------------------------
     4. Wiring
  ------------------------------------------------------------------ */

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  var debouncedRender = debounce(render, 250);
  el.src.addEventListener('input', function (e) {
    try { localStorage.setItem(STORAGE_KEY, e.target.value); } catch (err) {}
    debouncedRender();
  });

  var SETTING_ELS = ['paperSel','marginSel','sizeSel','familySel','zoomSel','justify','h1Break','guides'];
  function saveSettings() {
    var s = {};
    SETTING_ELS.forEach(function (k) {
      s[k] = el[k].type === 'checkbox' ? el[k].checked : el[k].value;
    });
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function loadSettings() {
    var s;
    try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) {}
    if (!s) return;
    SETTING_ELS.forEach(function (k) {
      if (!(k in s)) return;
      if (el[k].type === 'checkbox') el[k].checked = !!s[k]; else el[k].value = s[k];
    });
  }

  SETTING_ELS.forEach(function (k) {
    el[k].addEventListener('change', function () {
      applyGeometry();
      applyH1Breaks();
      saveSettings();
      layout();
    });
  });

  window.addEventListener('resize', debounce(layout, 120));

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'p') {
      e.preventDefault();
      document.getElementById('pdfBtn').click();
    }
  });

  function boot() {
    if (!window.marked) { setTimeout(boot, 50); return; }
    loadSettings();
    applyGeometry();
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) el.src.value = saved;
    } catch (e) {}
    render();
    // Re-render once KaTeX webfonts land so measured page count is accurate.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
